<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Waste Ops | QR Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#410004",
                        "outline": "#6d7a72",
                        "on-primary": "#ffffff",
                        "on-background": "#191c1e",
                        "tertiary-fixed": "#ffdad7",
                        "error": "#ba1a1a",
                        "tertiary": "#9b3e3b",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-fixed-variant": "#173bab",
                        "primary-fixed": "#85f8c4",
                        "surface-variant": "#e0e3e5",
                        "inverse-on-surface": "#eff1f3",
                        "background": "#f7f9fb",
                        "on-secondary-fixed": "#001453",
                        "surface-bright": "#f7f9fb",
                        "secondary-fixed-dim": "#b8c4ff",
                        "on-tertiary-fixed-variant": "#7f2928",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#fffbff",
                        "outline-variant": "#bccac0",
                        "on-secondary-container": "#00217a",
                        "primary": "#006948",
                        "secondary-container": "#708cfd",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "on-primary-fixed-variant": "#005137",
                        "on-surface-variant": "#3d4a42",
                        "secondary-fixed": "#dde1ff",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "tertiary-container": "#ba5551",
                        "primary-container": "#00855d",
                        "secondary": "#3755c3",
                        "on-primary-container": "#f5fff7",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#68dba9",
                        "surface-dim": "#d8dadc",
                        "primary-fixed-dim": "#68dba9",
                        "surface-tint": "#006c4a",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "on-error": "#ffffff",
                        "surface-container": "#eceef0",
                        "surface": "#f7f9fb",
                        "on-primary-fixed": "#002114"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-transition {
            transition: background-color 0.3s ease;
        }
        .scanner-frame {
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.7);
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #85f8c4, transparent);
            animation: scan 3s linear infinite;
            position: absolute;
            width: 100%;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black font-body text-on-surface overflow-hidden h-screen w-screen">
<!-- Camera Viewport (Background) -->
<div class="fixed inset-0 z-0">
<div class="w-full h-full bg-cover bg-center" data-alt="Close up of a industrial waste bin side with a weathered QR code sticker attached, metallic surface, high-tech industrial setting, cinematic lighting" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCvI_JOwMDIyNpVUnl-fsl7I6oA4ejYvXBtgBYSKQDGuSjPfsZ6RaG7ZP1m7VMicTJjRZ0uu429hq4TvogemNLJW2YP0hLLLE-77JqBMYAgq9BqHWHsGXmxPL9hJLp9vugItaYmsgyMXB00VhHLmhYN63UCoA5OVme5ACd2zfmlGNkjzvVgt-GrkVjxKo3DpuDgrpwiyZstBz5PxsK4Qn8tt0s2TobRRC2yD9203vfWHrszrtYEc5L8vmKEy8Cszq0Hya5t6hu6ZQ')">
</div>
</div>
<!-- UI Overlay Layer -->
<div class="relative z-10 flex flex-col h-full">
<!-- Top Navigation (Contextual Suppression of TopAppBar as it's Task-Focused) -->
<header class="flex justify-between items-center w-full px-6 py-8">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 backdrop-blur-md text-white tap-highlight-transparent hover:bg-white/20 transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="px-4 py-2 rounded-full bg-white/10 backdrop-blur-md">
<span class="text-white font-label text-sm font-medium tracking-wide">Scanning Asset Tag</span>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 backdrop-blur-md text-white tap-highlight-transparent hover:bg-white/20 transition-all">
<span class="material-symbols-outlined" data-icon="flashlight_on">flashlight_on</span>
</button>
</header>
<!-- Scanner Central Viewport -->
<main class="flex-grow flex items-center justify-center p-8">
<div class="relative w-full max-w-sm aspect-square scanner-frame rounded-[2rem] overflow-hidden border-2 border-primary-fixed/30">
<!-- Corner Indicators -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-primary-fixed rounded-tl-3xl"></div>
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-primary-fixed rounded-tr-3xl"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-primary-fixed rounded-bl-3xl"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-primary-fixed rounded-br-3xl"></div>
<!-- Scanning Animation Line -->
<div class="scan-line shadow-[0_0_15px_#85f8c4]"></div>
<!-- Guidance Overlay -->
<div class="absolute inset-0 flex flex-col items-center justify-end pb-8">
<p class="text-primary-fixed font-medium text-sm tracking-widest uppercase opacity-70">Align QR Code</p>
</div>
</div>
</main>
<!-- Bottom Controls & Info -->
<footer class="p-8 pb-12 flex flex-col items-center gap-6">
<!-- Asset Preview Card (Glassmorphism) -->
<div class="w-full max-w-md bg-slate-900/60 backdrop-blur-2xl p-6 rounded-[2rem] border border-white/5 shadow-2xl">
<div class="flex items-center gap-4">
<div class="w-14 h-14 rounded-2xl bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed text-3xl" data-icon="qr_code_scanner">qr_code_scanner</span>
</div>
<div class="flex-grow">
<p class="text-white/60 text-xs font-label uppercase tracking-tighter mb-1">Status</p>
<h3 class="text-white text-lg font-bold leading-none">Ready for Input</h3>
</div>
<div class="flex flex-col items-end">
<span class="text-primary-fixed text-xs font-bold bg-primary/20 px-2 py-1 rounded-md">AUTO-SYNC</span>
</div>
</div>
</div>
<!-- Manual Input Secondary Action -->
<button class="flex items-center gap-2 text-white/50 hover:text-white transition-colors py-2 px-4 rounded-xl hover:bg-white/5">
<span class="material-symbols-outlined text-xl" data-icon="keyboard">keyboard</span>
<span class="text-sm font-medium">Enter Asset ID Manually</span>
</button>
</footer>
<!-- Bottom Feedback Bar (Decorative Logic) -->
<div class="w-full h-1 bg-primary/20">
<div class="h-full bg-primary-fixed w-1/3 shadow-[0_0_10px_#85f8c4]"></div>
</div>
</div>
<!-- Eco-Pulse Interaction (Visual Only) -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] aspect-square bg-primary-fixed rounded-full opacity-0 pointer-events-none transition-all duration-700 ease-out scale-50"></div>
</body></html>
