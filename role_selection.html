<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .signature-gradient {
            background: linear-gradient(135deg, #006948 0%, #00855d 100%);
        }
        .tonal-transition {
            transition: background-color 0.3s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-container-lowest font-body text-on-surface min-h-screen flex flex-col">
<!-- Top Bar (Suppressed for focused entry, but using branding from TopAppBar JSON logic) -->
<header class="w-full px-6 py-8 flex justify-center md:justify-start items-center">
<h1 class="text-emerald-900 dark:text-emerald-50 font-black tracking-tighter text-2xl">Waste Ops</h1>
</header>
<main class="flex-grow flex items-center justify-center px-4 pb-12">
<div class="max-w-md w-full flex flex-col gap-8">
<!-- Headline Section -->
<div class="text-center space-y-2">
<h2 class="text-on-surface font-headline text-3xl font-extrabold tracking-tight">Select Your Role</h2>
<p class="text-on-surface-variant text-sm font-medium">Choose your workspace to begin managing operations</p>
</div>
<!-- Role Selection Grid -->
<div class="grid grid-cols-1 gap-4">
<!-- Driver / Collector Card -->
<button class="group relative flex items-center p-6 bg-surface-container-low hover:bg-white rounded-xl transition-all duration-300 ring-1 ring-outline-variant/10 hover:shadow-[0_12px_32px_rgba(25,28,30,0.06)] overflow-hidden">
<div class="flex h-14 w-14 items-center justify-center rounded-xl bg-primary-container text-on-primary-container shrink-0 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-3xl" data-icon="local_shipping">local_shipping</span>
</div>
<div class="ml-5 text-left">
<h3 class="text-lg font-bold text-on-surface leading-tight">🚛 Driver / Collector</h3>
<p class="text-on-surface-variant text-sm mt-1">Route navigation &amp; bin collection</p>
</div>
<div class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Vendor Card -->
<button class="group relative flex items-center p-6 bg-surface-container-low hover:bg-white rounded-xl transition-all duration-300 ring-1 ring-outline-variant/10 hover:shadow-[0_12px_32px_rgba(25,28,30,0.06)] overflow-hidden">
<div class="flex h-14 w-14 items-center justify-center rounded-xl bg-secondary-container text-on-secondary-container shrink-0 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-3xl" data-icon="storefront">storefront</span>
</div>
<div class="ml-5 text-left">
<h3 class="text-lg font-bold text-on-surface leading-tight">🏪 Vendor</h3>
<p class="text-on-surface-variant text-sm mt-1">Request pickups &amp; manage service</p>
</div>
<div class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-secondary" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Admin Dashboard Card -->
<button class="group relative flex items-center p-6 bg-surface-container-low hover:bg-white rounded-xl transition-all duration-300 ring-1 ring-outline-variant/10 hover:shadow-[0_12px_32px_rgba(25,28,30,0.06)] overflow-hidden">
<div class="flex h-14 w-14 items-center justify-center rounded-xl bg-tertiary-container text-on-tertiary-container shrink-0 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-3xl" data-icon="dashboard_customize">dashboard_customize</span>
</div>
<div class="ml-5 text-left">
<h3 class="text-lg font-bold text-on-surface leading-tight">🛠 Admin Dashboard</h3>
<p class="text-on-surface-variant text-sm mt-1">Fleet oversight &amp; analytics</p>
</div>
<div class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-tertiary" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</div>
<!-- Footer Meta -->
<div class="mt-4 text-center">
<span class="text-outline text-[0.75rem] font-medium tracking-widest uppercase">v2.4.0 • Enterprise Edition</span>
</div>
</div>
</main>
<!-- Background Decoration (Asymmetric Editorial Style) -->
<div class="fixed top-0 right-0 w-1/3 h-full pointer-events-none -z-10 opacity-20 hidden lg:block">
<div class="h-full w-full signature-gradient mask-image-[linear-gradient(to_left,white,transparent)]" style="clip-path: polygon(20% 0%, 100% 0%, 100% 100%, 0% 100%);"></div>
</div>
<!-- Image for Visual Context (Floating in Background) -->
<div class="fixed bottom-12 left-12 w-64 h-64 opacity-10 hidden xl:block pointer-events-none">
<img alt="Environmental sustainability icon" class="w-full h-full object-contain" data-alt="minimalist graphic of a recycling truck icon in white on a transparent background with subtle soft shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDu9nJuRE0XRhC6EmSQuES7ODiED7Zxn8N9AEdAm4eCJMhimMkrz9Y_4CKYiiZt4Cz0_cvnp70Goib3sDk3Vc3JxKVB8tuqc5jFLOF00eB7cEIsldVX7wlFixpMFOOKldcqMsfB5xGTQdCiY3U2egW0k0PX0euC-m4xkmMY7TFDfMTwm_HjKSssYTpis5LVqcwN3_HuvGu3dOtuAPi-jZUvZtH1MOiiGKkgqgMnQcyHkvd38RarfqOac6r1f0oyGroYaZMynsagyw"/>
</div>
</body></html>
