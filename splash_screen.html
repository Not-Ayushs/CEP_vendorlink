            background: linear-gradient(180deg, #ffffff 0%, #f7f9fb 100%);
        }

            background: linear-gradient(135deg, #006948 0%, #00855d 100%);

<body class="bg-surface-container-lowest font-body text-on-surface antialiased overflow-hidden">
<!-- Main Content Canvas: Splash Screen -->
<main class="flex flex-col items-center justify-center min-h-screen w-full relative">
<!-- Abstract Background Texture (Subtle) -->
<div class="absolute inset-0 pointer-events-none opacity-20 overflow-hidden">
<div class="absolute -top-1/4 -right-1/4 w-[800px] h-[800px] rounded-full bg-primary-fixed/30 blur-[120px]"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-[600px] h-[600px] rounded-full bg-secondary-fixed/20 blur-[100px]"></div>
</div>

<div class="z-10 flex flex-col items-center gap-6">
<!-- Icon Identity -->
<div class="w-24 h-24 rounded-[2rem] signature-gradient flex items-center justify-center shadow-2xl shadow-primary/20">
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">
                    recycling
                </span>
</div>
<!-- Text Identity -->
<div class="flex flex-col items-center">
<h1 class="font-headline text-5xl font-black text-on-surface tracking-tighter leading-none">
                    Waste Ops
                </h1>
<p class="font-label text-sm font-medium text-primary tracking-[0.2em] mt-3 uppercase">
                    Precision Utility
                </p>
</div>
</div>
<!-- Footer Meta/Status Area -->
<div class="absolute bottom-16 flex flex-col items-center gap-4">

<div class="flex gap-1.5 h-1 items-end">
<div class="w-2 h-1 bg-primary rounded-full"></div>
<div class="w-6 h-1 bg-primary rounded-full opacity-40"></div>
<div class="w-2 h-1 bg-primary rounded-full opacity-20"></div>
</div>
<p class="font-label text-outline text-[0.65rem] tracking-widest font-bold">
                OPERATIONS CONTROL v2.4.0
            </p>
</div>
<!-- Bottom Signature Detail: The "Eco-Pulse" placeholder -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-primary/10">
<div class="h-full bg-primary w-1/3 rounded-r-full"></div>
</div>
</main>
<!-- Semantic Shell Suppression Logic: 
         This is a Splash Screen (Transactional/Focus State), 
         per instructions we suppress BottomNavBar and TopAppBar shells to prioritize the canvas.
    -->
