<body class="bg-surface-container-lowest min-h-screen flex flex-col items-center justify-center p-6 text-on-surface">
<div class="w-full max-w-md space-y-12">

<div class="w-12 h-12 signature-gradient rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-white text-3xl" data-icon="local_shipping">local_shipping</span>

<p class="text-on-surface-variant body-lg">Access your route and field operations.</p>
</div>
</header>
<form class="space-y-8">
<div class="space-y-6">
<div class="relative group">
<label class="block text-xs font-medium text-primary mb-1.5 ml-1" for="phone">Phone Number</label>
<div class="flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container-lowest focus-within:ring-2 focus-within:ring-primary/20 transition-all duration-200">
<div class="pl-4 pr-2 text-on-surface-variant font-medium">+1</div>
<input class="w-full bg-transparent border-none focus:ring-0 py-4 pr-4 text-lg font-medium tracking-wide placeholder:text-outline-variant" id="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<div class="flex items-center justify-between gap-4">
<div class="h-px flex-1 bg-outline-variant/20"></div>
<button class="text-sm font-bold text-secondary px-2 py-1 rounded hover:bg-secondary-container/10 transition-colors" type="button">
                        Get OTP
                    </button>
<div class="h-px flex-1 bg-outline-variant/20"></div>
</div>
<div class="relative group opacity-50">
<label class="block text-xs font-medium text-on-surface-variant mb-1.5 ml-1" for="otp">Verification Code</label>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-4 text-center text-2xl tracking-[1em] font-bold" disabled="" id="otp" placeholder="······" type="text"/>
</div>
</div>
<div class="space-y-4 pt-4">
<button class="w-full signature-gradient text-white h-[56px] rounded-xl font-bold text-lg shadow-lg shadow-primary/10 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Continue
                    <span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center text-sm text-on-surface-variant px-8">
                    By logging in, you agree to our <a class="underline font-medium text-on-surface" href="#">Terms of Service</a> and <a class="underline font-medium text-on-surface" href="#">Privacy Policy</a>.
                </p>
</div>
</form>
<div class="pt-12 grid grid-cols-1 gap-6">
<div class="relative overflow-hidden rounded-2xl h-48 group">
<img alt="Sanitation worker driving truck" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="Modern high-tech garbage truck driver seat cabin view with dashboard screens at sunrise in a clean urban environment" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDZLSB7lAOarnQW3s31xCKZBb8PP7h5uG7OBadNGJM9wIbZTr-yO61WMrpc5FC1T7UKeoCBBIO1x7N0wHYl0Iqu3_80082RILH3YMsVuKM3OCGYJnoWNRKI_bxJ_44zwB8tsMggXxj16J4FYzjBk1bIu2ygKY0BNUcVRKO05NqY_Uf5S9Jym1KYgLU9FyELDDGPD_QOqXqTbHffUQPcOWlylk52zGm87Gj5jlJPbgIHin48sTII2JdAOyWeforeghu8Rvm9lhZ-fw"/>
